# ruff rev matches the ruff pin in constraints/cpu.txt; bump both together.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast tests)
        entry: python scripts/tasks.py test
        language: system
        pass_filenames: false
        always_run: true
