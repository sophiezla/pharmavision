name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/cpu.txt
      - name: Install
        run: python scripts/tasks.py setup --no-hooks
      - name: Lint
        run: python scripts/tasks.py lint
      - name: Test
        run: python scripts/tasks.py test
