# @package _global_
# PLAN 1.11: tiny CNN, 1 epoch, up to 64 training images of fold 0, CPU; complete run folder.
# Runs the real `train` task with tiny settings. `tasks.py smoke` sets data.dataset=real when the
# processed data exist and leaves toy otherwise (CI).
defaults:
  - override /model: cnn_small

exp: smoke
task: train
variant: ${data.dataset}
fold: 0
seed: 0
device: cpu

data:
  dataset: toy
  img_size: 64
  max_train_images: 64
  max_external_per_source: 16   # keeps decoding of large external photos fast

train:
  max_epochs: 1
  batch_size: 16
  eval_batch_size: 32
  lr: 1.0e-3
  warmup_epochs: 0

paths:
  runs_dir: ${paths.results_dir}/scratch/runs
  checkpoints_dir: ${paths.results_dir}/scratch/checkpoints
  toy_dir: ${paths.results_dir}/scratch/toy
