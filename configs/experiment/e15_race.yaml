# @package _global_
# E15 arms race (PLAN 7.11; docs/experiments/E15.md). Round r of one fold/seed lineage; the job
# sets race.round and variant round<r>. Round 0 = the final model's run (race.base_*).
exp: e15race
task: race
variant: round1
train:
  backbone_lr_mult: 1.0
model:
  mode: lora
  lora_rank: 8
data:
  split_version: 2
race:
  round: 1
  base_exp: e05
  base_model: efficientnetv2-s
  base_variant: default
