# E8 PatchCore (PLAN 4.6) through anomalib 2.7.0 (optional extra [anomaly]); fitted on authentic
# training images only (task one_class). Settings are anomalib's PatchCore defaults.
name: patchcore
kind: patchcore
backbone_name: wide_resnet50_2
layers: [layer2, layer3]
pretrained: true
coreset_ratio: 0.1
num_neighbors: 9
img_size: 224
mean: [0.485, 0.456, 0.406]   # ImageNet, as anomalib's default pre-processor
std: [0.229, 0.224, 0.225]
