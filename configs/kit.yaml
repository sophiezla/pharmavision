# GPU kit settings (ADR-011). The RTX 5060 needs CUDA >= 12.8; for the pinned torch 2.14.1 on
# Windows / Python 3.13, only the CUDA 13.0 build exists (checked 2026-10-10).
uv_version: 0.13.0
torch_index: https://download.pytorch.org/whl/cu130
disk_gb_per_job: 0.4   # rough upper bound for checkpoints (best.pt) per run, for the README
