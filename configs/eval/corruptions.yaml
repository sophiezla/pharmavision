# E9 corruptions (PLAN 4.8, docs/experiments/E09.md). One value per severity 1-8; severity 0 is
# the identity. Parameters are in model-input pixels: corruptions are applied after the
# evaluation geometry (resize + crop), so they act equally on both classes whatever their
# native resolution (ADR-005). Severities 1-5 are the pre-registered grid; 6-8 the extension
# fixed in ADR-024 (PLAN 4.11).
quality_auroc: 0.85             # ADR-023: e09_quality_limits threshold
severities:
  gaussian_blur: [0.5, 1.0, 1.5, 2.0, 3.0, 4, 6, 8]  # Gaussian sigma, px
  motion_blur: [3, 5, 7, 9, 13, 17, 25, 35]  # line-kernel length, px; angle random per image
  gaussian_noise: [0.02, 0.04, 0.06, 0.09, 0.12, 0.18, 0.25, 0.35]  # noise sd on the 0-1 intensity scale
  jpeg: [80, 60, 40, 25, 10, 5, 4, 3]  # JPEG quality (libjpeg output is identical below 3)
  brightness: [0.8, 0.65, 0.5, 0.4, 0.3, 0.2, 0.12, 0.06]  # PIL brightness factor (darkening)
  contrast: [0.8, 0.65, 0.5, 0.4, 0.3, 0.2, 0.12, 0.06]  # PIL contrast factor
  rotation: [5, 10, 15, 25, 35, 45, 60, 90]  # degrees; sign random per image, white fill
  perspective: [0.05, 0.1, 0.15, 0.2, 0.3, 0.35, 0.4, 0.45]  # max corner shift as a fraction of the side
  glare: [0.2, 0.35, 0.5, 0.65, 0.8, 0.9, 1.0, 1.2]  # peak additive intensity of the highlight
